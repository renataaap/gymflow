name: Verificar GymFlow Node e PostgreSQL
on:
  push:
    branches: [work, main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - name: Compilar React e TypeScript
        run: npm run build
      - name: Testar API e políticas RLS no PostgreSQL real
        run: npm test
