name: Verificar GymFlow
on:
  push:
    branches: [work, main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar Python e JavaScript
        run: |
          python -m compileall -q app
          node --check app/static/app.js
      - name: Testar API e inicialização na hospedagem
        run: python -m unittest discover -s tests -p 'test_*.py' -v
