# Node.js + React/TypeScript + PostgreSQL gerenciado. Sem runtime Python.
services:
  - type: web
    name: gymflow-node
    runtime: node
    branch: work
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GYMFLOW_DEMO
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: gymflow-postgres
          property: connectionString

databases:
  - name: gymflow-postgres
    databaseName: gymflow
    user: gymflow
    postgresMajorVersion: "18"
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: oregon
    ipAllowList: []
